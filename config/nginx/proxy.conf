# Lab 12.1: nginx in front of two shikumi-api instances.
# Ubuntu/Debian: /etc/nginx/sites-available/shikumi (symlinked into sites-enabled)
# Fedora/RHEL:   /etc/nginx/conf.d/shikumi.conf

upstream shikumi_api {
    server 127.0.0.1:8001 max_fails=1 fail_timeout=10s;
    server 127.0.0.1:8002 max_fails=1 fail_timeout=10s;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location / {
        proxy_pass http://shikumi_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 2s;
    }
}
