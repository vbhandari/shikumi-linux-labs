# Lab 12.2: HTTPS with HTTP/2, and a redirect from HTTP.
# Legacy variant for nginx older than 1.25.1 (no "http2 on;" directive).

upstream shikumi_api {
    server 127.0.0.1:8001 max_fails=1 fail_timeout=10s;
    server 127.0.0.1:8002 max_fails=1 fail_timeout=10s;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;

    ssl_certificate     /etc/nginx/shikumi-tls/server.crt;
    ssl_certificate_key /etc/nginx/shikumi-tls/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Allowlist: only /healthz reaches the app. /alloc, /cpu,
    # /files, /slow, /checksum and /data are lab and fault
    # endpoints; labs call them on 127.0.0.1:800x directly.
    # Port 80/443 may face the internet: never proxy them.
    location = /healthz {
        proxy_pass http://shikumi_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 2s;
    }

    location / {
        return 404;
    }
}
